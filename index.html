<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>emsh — Pokédex</title>
    <meta
      name="description"
      content="Em's fan-made Pokémon: the Lacadia and Andela regional dexes, plus one-off designs."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='22' y='22' width='56' height='56' fill='%23ffd200' transform='rotate(45 50 50)'/></svg>"
    />
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="hub.css" />
    <link rel="stylesheet" href="lacadia/data/region.css" />
    <link rel="stylesheet" href="andela/data/region.css" />
    <link rel="stylesheet" href="misc/data/region.css" />
    <script src="shared/theme.js" defer></script>
    <script src="hub.js" type="module"></script>
  </head>
  <body class="hub">
    <header class="hub-head">
      <h1 class="banner">emsh<span class="dot">.</span> dex</h1>
      <p class="hub-sub">Fan-made Pokémon, drawn by Em. Pick a region.</p>
    </header>

    <main class="regions">
      <!-- data-region names a folder with data/pokedex.csv; hub.js fills in the
           count. data-hero is the Pokémon shown on the card. -->
      <a class="region" href="lacadia/index.html" data-region="lacadia" data-hero="faestalk">
        <span class="region-bg"></span>
        <span class="banner region-name">Lacadia</span>
        <img class="region-art" alt="" />
        <span class="region-foot glass">
          <span class="region-count">&nbsp;</span>
          <span class="region-go">Enter dex</span>
        </span>
      </a>

      <a class="region" href="andela/index.html" data-region="andela" data-hero="amistaphore">
        <span class="region-bg"></span>
        <span class="banner region-name">Andela</span>
        <img class="region-art" alt="" />
        <span class="region-foot glass">
          <span class="region-count">&nbsp;</span>
          <span class="region-go">Enter dex</span>
        </span>
      </a>

      <a class="region" href="misc/index.html" data-region="misc">
        <span class="region-bg"></span>
        <span class="banner region-name">Misc</span>
        <span class="region-empty">
          <span class="diamonds" aria-hidden="true"><i></i><i></i><i></i></span>
          Redesigns &amp; one-offs
        </span>
        <span class="region-foot glass">
          <span class="region-count">&nbsp;</span>
          <span class="region-go">Enter</span>
        </span>
      </a>
    </main>

    <footer class="hub-foot">
      Fan-made project, not affiliated with or endorsed by Pokémon, Nintendo,
      Game Freak, or The Pokémon Company. Art &copy; @EmSheshan.
    </footer>
  </body>
</html>
